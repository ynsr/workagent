[project]
name = "harness"
version = "0.2.1"
description = "Launch AI agent harnesses in git-wt worktrees from issue/PR links"
requires-python = ">=3.10"
dependencies = ["typer>=0.12", "rich>=13"]

[project.scripts]
harness = "harness.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
