[project]
name = "git-wt"
version = "0.1.2"
description = "Create/finish/cleanup git worktrees for AI agent task isolation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "rich>=13",
]

[project.scripts]
git-wt = "git_wt.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/git_wt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
